name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build the bundle
        run: |
          npm ci
          npm run rollup

      - name: Package release zip
        run: |
          cd dist
          zip -r "$GITHUB_WORKSPACE/hass-3d-floorplan.zip" . -x '*.zip'
          cd ..
          ls -la hass-3d-floorplan.zip

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: hass-3d-floorplan.zip
          asset_name: hass-3d-floorplan.zip
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload individual js (backward compat with older HACS clients)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/hass-3d-floorplan.js
          asset_name: hass-3d-floorplan.js
          tag: ${{ github.ref }}
          overwrite: true
