name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build the bundle
        run: |
          npm ci
          npm run rollup
          ls -la dist/

      - name: Upload hass-3d-floorplan.js
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/hass-3d-floorplan.js
          asset_name: hass-3d-floorplan.js
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload draco_decoder.js
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/draco_decoder.js
          asset_name: draco_decoder.js
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload draco_decoder.wasm
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/draco_decoder.wasm
          asset_name: draco_decoder.wasm
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload draco_wasm_wrapper.js
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/draco_wasm_wrapper.js
          asset_name: draco_wasm_wrapper.js
          tag: ${{ github.ref }}
          overwrite: true
