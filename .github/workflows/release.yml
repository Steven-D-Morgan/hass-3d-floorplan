name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build the file
        run: |
          npm install
          npm run rollup

      - name: Upload js to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/hass-3d-floorplan.js
          asset_name: hass-3d-floorplan.js
          tag: ${{ github.ref }}
          overwrite: true
